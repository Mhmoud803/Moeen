services:
  db:
    image: postgres:latest
    container_name: moeen_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: moeen

    volumes:
      - postgres_data:/var/lib/postgresql/data



  frontend:
    image: node:20-alpine
    container_name: jobportal-frontend
    working_dir: /app
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3001"
    ports:
      - "3001:3001"

volumes:
  postgres_data:
