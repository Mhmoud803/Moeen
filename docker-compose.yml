name: moeen

services:
  db:
    image: postgres:16
    container_name: moeen-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: moeen
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moeen"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    image: moeen-backend:local
    pull_policy: build
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moeen-backend
    restart: unless-stopped
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: moeen
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: root
      SQL_SHOW: "false"
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header='X-Moeen-Owner: compose-healthcheck' http://localhost:8080/api/study/preferences || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    image: moeen-frontend:local
    pull_policy: build
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moeen-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: backend_postgres_data
